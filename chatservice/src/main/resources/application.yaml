spring:
  application:
    name: chatservice
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
        verbosity: "medium"
    mcp:
      client:
        type: SYNC
        initialized: false
        toolcallback:
          enabled: false
        request-timeout: 10s
        streamable-http:
          connections:
            rag:
              url: ${RAG_MCP_URL:http://localhost:8082}
              endpoint: /mcp