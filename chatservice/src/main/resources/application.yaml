spring:
  application:
    name: chatservice
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
        verbosity: "medium"
    mcp:
      client:
        type: SYNC
        initialized: false
        toolcallback:
          enabled: false
        request-timeout: 10s
        streamable-http:
          connections:
            rag:
              url: ${RAG_MCP_URL:http://localhost:8082}
              endpoint: /mcp
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/auth/realms/document-chat}
          audiences:
            - chat-api
server:
  port: ${SERVER_PORT:8081}
