server:
  port: ${MCP_RAG_PORT:8082}

spring:
  application:
    name: itknowledgebase
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/document-chat}
          audiences:
            - mcp-api
  ai:
    mcp:
      server:
        protocol: STREAMABLE

itknowledgebase:
  dir:
    path: data